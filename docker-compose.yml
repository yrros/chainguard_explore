version: '3.9'
services:
  web:
    build:
      context: ./app
      secrets:
        - netrc
    ports:
      - "8000:8000"
    # Credentials are read from .env (git-ignored; copy .env.example to create it).
    # This is for local dev only: when deployed, they should come from the
    # environment the app runs in, e.g. Kubernetes Secrets or a secrets manager.
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:?set in .env}:${POSTGRES_PASSWORD:?set in .env}@db:5432/${POSTGRES_DB:?set in .env}
      SECRET_KEY: ${SECRET_KEY:?set in .env}
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./app:/app

  db:
    image: cgr.dev/chainguard/postgres:latest
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?set in .env}
      POSTGRES_USER: ${POSTGRES_USER:?set in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in .env}
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "${POSTGRES_USER}", "-d", "${POSTGRES_DB}"]
      interval: 2s
      timeout: 3s
      retries: 15
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # Chainguard's postgres image runs init scripts from here, not /docker-entrypoint-initdb.d
      - ./db/init.sql:/var/lib/postgres/initdb/init.sql

volumes:
  postgres_data:

secrets:
  netrc:
    file: ${HOME}/.netrc
